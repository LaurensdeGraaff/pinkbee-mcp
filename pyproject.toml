[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinkbee-mcp"
version = "0.2.0"
description = "Read-only MCP server for Pinkbee volunteer rosters, with built-in mock data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laurens de Graaff" }]
maintainers = [{ name = "Laurens de Graaff" }]
keywords = ["mcp", "model-context-protocol", "pinkbee", "volunteers", "roster", "scheduling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.urls]
Homepage = "https://github.com/withoutanickname/pinkbee-mcp"
Repository = "https://github.com/withoutanickname/pinkbee-mcp"
Issues = "https://github.com/withoutanickname/pinkbee-mcp/issues"
Documentation = "https://github.com/withoutanickname/pinkbee-mcp/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
pinkbee-mcp = "pinkbee_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pinkbee_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "DTZ", "TRY", "RUF"]
ignore = [
    "TRY003",  # long messages inside raise are deliberate: they are what the model reads
    "TRY300",  # return-in-try reads better than an else block here
    "TRY301",  # ditto for raise-in-try
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "DTZ011"]  # tests may use the plain local date
# Every tool deliberately catches Exception: a tool must return an "Error: ..."
# sentence to the model instead of raising through the MCP protocol.
"src/pinkbee_mcp/server.py" = ["BLE001"]
