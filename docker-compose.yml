services:
  pinkbee-mcp:
    # Published image. Pin a version instead of :latest for a real deployment.
    image: withoutanickname/pinkbee-mcp:latest
    # To build from this checkout instead, uncomment the next line and run
    # `docker compose up -d --build`.
    # build: .
    restart: unless-stopped
    environment:
      PINKBEE_DATA_SOURCE: ${PINKBEE_DATA_SOURCE:-mock}
      PINKBEE_BASE_URL: ${PINKBEE_BASE_URL:-}
      PINKBEE_LOGIN: ${PINKBEE_LOGIN:-}
      PINKBEE_PASSWORD: ${PINKBEE_PASSWORD:-}
      PINKBEE_ALLOW_INSECURE_HTTP_TO_LOCALHOST: ${PINKBEE_ALLOW_INSECURE_HTTP_TO_LOCALHOST:-false}
      PINKBEE_ALLOW_PERSONAL_DATA: ${PINKBEE_ALLOW_PERSONAL_DATA:-false}
      PINKBEE_MCP_TOKEN: ${PINKBEE_MCP_TOKEN:-}
      PINKBEE_ALLOWED_SENDERS: ${PINKBEE_ALLOWED_SENDERS:-}
      PINKBEE_DISABLED_CALLS: ${PINKBEE_DISABLED_CALLS:-}
      PINKBEE_TIMEZONE: ${PINKBEE_TIMEZONE:-Europe/Amsterdam}
      PINKBEE_TIMEOUT_SECONDS: ${PINKBEE_TIMEOUT_SECONDS:-20}
      PINKBEE_LOG_LEVEL: ${PINKBEE_LOG_LEVEL:-INFO}

    ports:
      # Reachable from the LAN by default. Use PINKBEE_ALLOWED_SENDERS to restrict
      # the IP of the client/service making the request.
      - "8087:8080"

    # The server writes nothing to disk.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
